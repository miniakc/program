name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install Inno Setup if unavailable
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
      - name: Build, OCR, install and test with Python removed from PATH
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EMSQuiz-Windows-installer
          path: |
            release/EMSQuiz-Setup-0.4.1.exe
            dist/bundle-smoke.json
            dist/installed-smoke.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: EMSQuiz-UI-QA
          path: dist/qa/
          if-no-files-found: error
      - name: Align this release tag with the verified build
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/windows-0.4.1';
            const repo = context.repo;
            try {
              const old = await github.rest.git.getRef({...repo, ref});
              if (old.data.object.sha !== context.sha) {
                await github.rest.git.updateRef({...repo, ref, sha: context.sha, force: true});
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...repo, ref: 'refs/' + ref, sha: context.sha});
            }
      - name: Publish tested installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-0.4.1
          name: EMS QUIZ Windows 0.4.1
          prerelease: true
          body: |
            Offline PDF/OCR to Markdown and images, with a GPT question prompt in the material ZIP.
            Import GPT JSON to solve multiple choice, OX and short-answer questions immediately.
            Display local question images, export question banks as Excel .xlsx, and run an automatic 10-second question countdown.
            Python and Korean/English OCR are bundled. No API key is required by this application.
            Tested with data/image/Excel/timer tests, real Windows UI, bundled OCR, and install/run/uninstall with Python removed from PATH.
          files: |
            release/EMSQuiz-Setup-0.4.1.exe
            dist/bundle-smoke.json
            dist/installed-smoke.json
