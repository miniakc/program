name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install Inno Setup if unavailable
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
      - name: Build, OCR, install and test with Python removed from PATH
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EMSQuiz-Windows-installer
          path: |
            release/EMSQuiz-Setup-0.6.2.exe
            dist/bundle-smoke.json
            dist/installed-smoke.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: EMSQuiz-UI-QA
          path: dist/qa/
          if-no-files-found: error
      - name: Align this release tag with the verified build
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/windows-0.6.2';
            const repo = context.repo;
            try {
              const old = await github.rest.git.getRef({...repo, ref});
              if (old.data.object.sha !== context.sha) {
                await github.rest.git.updateRef({...repo, ref, sha: context.sha, force: true});
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...repo, ref: 'refs/' + ref, sha: context.sha});
            }
      - name: Publish tested installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-0.6.2
          name: EMS QUIZ Windows 0.6.2
          prerelease: true
          body: |
            One Markdown format: rejoin visual wraps, then break lines at sentence boundaries.
            Keep real paragraphs, titles, callouts, lists, tables, figures and source page anchors.
            Baseline text grouping handles mixed font bounds and small reference numbers.
            Recurring-gutter detection avoids splitting justified spaces into false columns.
            Decimals and common English abbreviations are protected. No added export modes.
            Old textbook text refreshes on export; existing question figures remain intact.
            Tested on Windows, including layout conversion and install/run/uninstall without Python on PATH.
          files: |
            release/EMSQuiz-Setup-0.6.2.exe
            dist/bundle-smoke.json
            dist/installed-smoke.json
