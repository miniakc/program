name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install Inno Setup if unavailable
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
      - name: Build, OCR, install and test with Python removed from PATH
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EMSQuiz-Windows-installer
          path: |
            release/EMSQuiz-Setup-0.5.0.exe
            dist/bundle-smoke.json
            dist/installed-smoke.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: EMSQuiz-UI-QA
          path: dist/qa/
          if-no-files-found: error
      - name: Align this release tag with the verified build
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/windows-0.5.0';
            const repo = context.repo;
            try {
              const old = await github.rest.git.getRef({...repo, ref});
              if (old.data.object.sha !== context.sha) {
                await github.rest.git.updateRef({...repo, ref, sha: context.sha, force: true});
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...repo, ref: 'refs/' + ref, sha: context.sha});
            }
      - name: Publish tested installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-0.5.0
          name: EMS QUIZ Windows 0.5.0
          prerelease: true
          body: |
            Delete registered textbooks while preserving existing questions and referenced images.
            Restore the original workspace design with textbook cards, topic cards and clickable quiz option tiles.
            Export figure regions with overlapping labels and arrows composited from the original PDF. No full-page PNG exports.
            Includes a local figure-region editor for scans and complex layouts. Existing question images remain available.
            Offline Markdown/GPT JSON workflow, mixed quizzes, Excel with embedded images and automatic 10-second countdown.
            Verified with automated tests, real Windows GUI/OCR and install/run/uninstall without Python on PATH.
          files: |
            release/EMSQuiz-Setup-0.5.0.exe
            dist/bundle-smoke.json
            dist/installed-smoke.json
